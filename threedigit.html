<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkin 3 digited number</title>
</head>
<body>
    <script>
        let number=parseInt(prompt("Enter a number"));
        number>=100 && number<=999 ? alert("three digit number") : alert(" Not a three digit number");
    </script>
</body>
</html>
