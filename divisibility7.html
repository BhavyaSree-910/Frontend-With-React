<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function divisibility(){
    let n=parseInt(prompt("Enter a number to check if it is divisible by 7:"));
    if(n%7==0){
        alert("The number is divisible by 7.");
    } else {
        alert("The number is not divisible by 7.");
    }
}
    </script>>
</head>
<body>
    <button onclick="divisibility()">Check Divisibility by 7</button>
</body>
</html>
