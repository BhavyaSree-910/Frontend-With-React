<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factor of 84</title>
    <script>
        function factor(){
            let n=parseInt(prompt("Enter a number"));
            if(84%n==0){
                alert("it is factor of 84");
            }
            else{
                alert("Not a factor of 84");
            }
        }
    </script>
</head>
<body>
    <button onclick="factor()">check</button>
</body>
</html>
