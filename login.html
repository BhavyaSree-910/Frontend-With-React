<!DOCTYPE html>
<html>
    <head>
        <title>My Login Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <style>
            .container{
                width:500px;
                height:200px;
                margin: 100px auto;
                padding: 20px;
                border: solid black;
                background-color: rgb(131, 232, 250);
            }
            form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
         .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
            color: aliceblue;
        }
         label {
                display: block;
                margin-bottom: 8px;
                text-align: center;
            }
             form div {
                margin-bottom: 12px;
            }
            #submit:hover{
                color:lightgreen;
            }
            #reset:hover{
                color:orange;
            }
        </style>
    </head>
    <body>
        <div class="container">
        <form action="" method="post">
            
            <h2 align="center">Login Page</h2>
            <div>
            <label for="username">User Name</label>
            <input type="text" name="username" required placeholder="Enter Username">
            </div>
            <div>
            <label for="password">Password</label>
            <input type="password" value="password" required minlength="6" maxlength="11">
            </div>
            <div class="button-group">
            <input id="submit" type="submit" value="submit" >
            <input id="reset" type="reset" value="reset" >  
            </div>
        </form>
        </div>
    </body>
</html>
