<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple of 3</title>
    <script>
        function multiple(){
            let n=parseInt(prompt("Enter a number"));
            if(n%3==0){
                alert("It is a multiple of 3");
            }
            else alert("Not a multiple of 3");
        }
    </script>
</head>
<body>
    <button onclick="multiple()">check here</button>
</body>
</html>
