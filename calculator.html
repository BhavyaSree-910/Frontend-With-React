<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script>
        function getValues(){
            var val1 = document.getElementById("num1").value;
            var val2 = document.getElementById("num2").value;

            if(val1 === "" || val2 === ""){
                alert("Please fill in both numbers.");
                return null;
            }

            var value1 = parseFloat(val1);
            var value2 = parseFloat(val2);

            if(isNaN(value1) || isNaN(value2)){
                alert("Please enter valid numbers.");
                return null;
            }
            return {value1, value2};
        }
        function displayResult(message) {
            document.getElementById("result").innerHTML = message;
        }

        function add(){
            var numbers = getValues();
            if(numbers == null) return;
            var sum = numbers.value1 + numbers.value2;
            displayResult("Result: " + sum);
        }

        function subtract(){
            var numbers = getValues();
            if(numbers == null) return;
            var difference = numbers.value1 - numbers.value2;
            displayResult("Result: " + difference);
        }

        function multiply(){
            var numbers = getValues();
            if(numbers == null) return;
            var product = numbers.value1 * numbers.value2;
            displayResult("Result: " + product);
        }

        function divide(){
            var numbers = getValues();
            if(numbers == null) return;
            if(numbers.value2 === 0){
                alert("Error: Division by zero is not allowed.");
                return;
            }
            var quotient = numbers.value1 / numbers.value2;
            displayResult("Result: " + quotient);
        }
        function clearFields(){
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("result").innerHTML = "Result: 0";
        }
    </script>
</head>
<body>
    <h1>Calculator</h1>
    <form onsubmit="event.preventDefault();">
        <input id="num1" type="number" step="any" placeholder="Enter first number">
        <input id="num2" type="number" step="any" placeholder="Enter second number">
    </form>
    <br>
    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <button onclick="clearFields()">Clear</button>

    <h2 id="result">Result: 0</h2>
</body>
</html>
